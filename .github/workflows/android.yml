name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/verify_ffmpeg_aar.py
      - name: Use official dependency repositories in CI
        run: |
          cat > "$RUNNER_TEMP/official-repositories.gradle" <<'GRADLE'
          settingsEvaluated { s ->
              s.pluginManagement.repositories.clear()
              s.pluginManagement.repositories.google()
              s.pluginManagement.repositories.mavenCentral()
              s.pluginManagement.repositories.gradlePluginPortal()
              s.dependencyResolutionManagement.repositories.clear()
              s.dependencyResolutionManagement.repositories.google()
              s.dependencyResolutionManagement.repositories.mavenCentral()
          }
          GRADLE
      - run: bash gradlew -I "$RUNNER_TEMP/official-repositories.gradle" testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bbdroid-debug
          path: app/build/outputs/apk/debug/*.apk
